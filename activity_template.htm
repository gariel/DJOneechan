<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music Player</title>

    <style>
        :root {
            color-scheme: light dark;

            --background: #ffffff;
            --foreground: #222222;
            --border: #dddddd;
            --secondary: #666666;
            --link: #0066cc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #1e1e1e;
                --foreground: #eeeeee;
                --border: #3a3a3a;
                --secondary: #aaaaaa;
                --link: #66b3ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;

            background: var(--background);
            color: var(--foreground);

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: var(--secondary);
            font-size: 14px;
        }

        .playlist {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .track {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .track:last-child {
            border-bottom: none;
        }

        .track-number {
            display: inline-block;
            width: 28px;
            color: var(--secondary);
        }

        a {
            color: var(--link);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<main>
    <h1>Music Playlist</h1>
    <p class="subtitle">Currently queued music</p>
    <div class="playlist">
        ###TRACKS##
    </div>
</main>
</body>
</html>
